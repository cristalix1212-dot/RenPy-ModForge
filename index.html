<script>
const {useState,useRef,useEffect}=React;
const html=htm.bind(React.createElement);
const uid=()=>'a'+Math.random().toString(36).slice(2,9);
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const I=({n,s=16})=>{const ic=window.lucide&&lucide.icons&&lucide.icons[n];if(!Array.isArray(ic))return null;
const nodes=(ic[0]==='svg'&&Array.isArray(ic[2])?ic[2]:ic).filter(Array.isArray);
return React.createElement('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',className:'shrink-0'},nodes.map(([t,a],i)=>React.createElement(t,{...a,key:i})))};
const inp='w-full bg-[#14171f] border border-white/10 rounded px-2 py-1 text-sm outline-none focus:border-violet-500';
const btn='flex items-center gap-1.5 px-2.5 py-1.5 rounded bg-white/5 hover:bg-white/10 text-sm text-left';
const pri='flex items-center justify-center gap-1.5 px-3 py-2 rounded bg-violet-600 hover:bg-violet-500 text-sm font-medium';
const F=({t,children})=>html`<label className="block text-xs text-zinc-400 mb-3">${t}<div className="mt-1">${children}</div></label>`;
const H=({t})=>html`<div className="text-[11px] uppercase tracking-wider text-zinc-500 mt-4 mb-2">${t}</div>`;
const Chk=({v,on,t})=>html`<label className="flex items-center gap-2 text-sm cursor-pointer mb-3"><input type="checkbox" checked=${v} onChange=${e=>on(e.target.checked)} className="accent-violet-500"/>${t}</label>`;
const ICON={bg:'Image',show:'User',hide:'EyeOff',say:'MessageSquare',code:'Code',menu:'GitBranch',if:'Split',set:'Variable',jump:'CornerDownRight',audio:'Music',scare:'Zap'};

const calc=(bl,n)=>{let bg=null,spr={};bl.slice(0,n+1).forEach(b=>{if(b.type==='bg'){bg=b;spr={}}else if(b.type==='show')spr[b.assetId]=b;else if(b.type==='hide')delete spr[b.assetId]});const l=bl[n];
  return{bg,spr,say:l&&l.type==='say'?l:null,menu:l&&l.type==='menu'?l.opts.map((o,j)=>({...o,j})):null}};
const slug=t=>t.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'file';
const fileMap=as=>{const u={},m={};as.forEach(a=>{const ext=((a.name.match(/\.([a-z0-9]+)$/i)||[])[1]||(a.kind==='audio'?'ogg':'png')).toLowerCase(),b=slug(a.name);let n=b,i=2;while(u[n+'.'+ext])n=b+'_'+i++;u[n+'.'+ext]=1;m[a.id]={base:n,file:n+'.'+ext,dir:a.kind==='audio'?'audio':a.kind==='font'?'gui':'images'}});return m};
const vname=(v,i)=>((v.name||'').trim().replace(/[^\wа-яёА-ЯЁ]+/g,'_').replace(/^(\d)/,'v_$1'))||'var_'+i;

const hx=v=>/^#[0-9a-fA-F]{6}$/.test(v||'')?v:'#ffffff';
const rgba=(h,a)=>{const n=parseInt(hx(h).slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const h8=(c,a)=>hx(c)+Math.round(a*255).toString(16).padStart(2,'0');
const Q=t=>'"'+String(t).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n')+'"';
const FF='PF,system-ui,sans-serif';
const DEF_SAY={x:.5,y:.96,w:1600,h:260,color:'#080a12',op:.78,radius:24,pad:40,size:42,img:'',qmOff:false,qm:{back:true,history:true,skip:true,auto:true,save:true},custom:''};
const BTN=(id,label,y)=>({id,label,x:.08,y,w:420,h:90,size:44,color:'#ffffff',hover:'#c4b5fd',bg:'#000000',op:.45});
const UI0={menu:{bg:'',music:'',btns:[BTN('start','Начать игру',.35),BTN('load','Загрузить',.47),BTN('prefs','Настройки',.59),BTN('quit','Выход',.71)]},
  prefs:{fs:true,music:true,sfx:true,master:true,speed:true,auto:true,skipU:true,skipC:true,bg:'#0f1218',slider:'#7c3aed',btn:'#ffffff',hover:'#c4b5fd'},say:DEF_SAY,font:''};
const HexIn=({v,on})=>html`<div className="flex gap-1"><input type="color" value=${hx(v)} onChange=${e=>on(e.target.value)} className="w-10 h-8 shrink-0 bg-transparent border-0 p-0"/><input className=${inp} value=${v} onChange=${e=>on(e.target.value)} placeholder="#FF4D4D"/></div>`;
function DBtn({b,k,on,pick,upd}){const d=useRef(null),[h,setH]=useState(false);
  return html`<div onPointerDown=${e=>{e.currentTarget.setPointerCapture(e.pointerId);d.current={px:e.clientX,py:e.clientY,x:b.x,y:b.y};pick(b.id)}}
    onPointerMove=${e=>{const o=d.current;if(!o)return;upd(b.id,{x:cl(o.x+(e.clientX-o.px)/k/1920,0,1),y:cl(o.y+(e.clientY-o.py)/k/1080,0,1)})}} onPointerUp=${()=>{d.current=null}}
    onPointerEnter=${()=>setH(true)} onPointerLeave=${()=>setH(false)}
    style=${{position:'absolute',left:b.x*1920,top:b.y*1080,width:b.w,height:b.h,display:'flex',alignItems:'center',justifyContent:'center',background:rgba(b.bg,b.op),color:hx(h?b.hover:b.color),fontSize:b.size,fontFamily:FF,cursor:'move',touchAction:'none',userSelect:'none',outline:on?'6px dashed #a78bfa':'none',zIndex:1500}}>${b.label}</div>`}
function Sprite({e,k,ed}){
  const d=useRef(null),a=e.a,sw=a.w*e.scale,sh=a.h*e.scale,t=e.tr0;
  const mv=ev=>{const s=d.current;if(!s)return;let x=s.x+(ev.clientX-s.px)/k,y=s.y+(ev.clientY-s.py)/k;
    if(ed.clamp){x=cl(x,Math.min(0,1920-sw),Math.max(0,1920-sw));y=cl(y,Math.min(0,1080-sh),Math.max(0,1080-sh))}
    ed.upd(e.id,{x:Math.round(x),y:Math.round(y)})};
  return html`<img src=${a.src} draggable=${false}
    onPointerDown=${ev=>{if(!ed)return;ev.currentTarget.setPointerCapture(ev.pointerId);d.current={px:ev.clientX,py:ev.clientY,x:e.x,y:e.y};ed.pick(e.id)}}

}

function Scene({pad,bg,prev,spr,say,menu,shake,blk,bd,ed,onMenu,empty,sty,extra,qmAct,qmOn}){
  const D={...DEF_SAY,...(sty||{})},qi=D.qmOff?[]:[['back','Назад'],['history','История'],['skip','Пропуск'],['auto','Авто'],['save','Сохранить']].filter(x=>D.qm[x[0]]),bx=(1920-D.w)*D.x,by=(1080-D.h)*D.y,qy=by>=70?by-60:by+D.h+10,bg0=D.img?`url(${D.img}) center/100% 100% no-repeat`:rgba(D.color,D.op);
  const st=useRef(null),[sz,setSz]=useState({w:600,h:340});
  useEffect(()=>{const el=st.current,ro=new ResizeObserver(()=>setSz({w:el.clientWidth||1,h:el.clientHeight||1}));ro.observe(el);return()=>ro.disconnect()},[]);
  const k=Math.max(.01,pad?.84*sz.w/1920:Math.min(sz.w/1920,sz.h/1080)),ox=pad?.08*sz.w:(sz.w-1920*k)/2,oy=pad?.08*sz.w:(sz.h-1080*k)/2;
  const im=b=>b&&html`<img key=${b.n} src=${b.src} draggable=${false} style=${{position:'absolute',left:0,top:0,width:b.w,height:b.h,maxWidth:'none',animation:b.fx?`fin ${b.fx}s linear`:'none'}}/>`;
  return html`<div ref=${st} className=${pad?'relative w-full overflow-hidden rounded-lg bg-[#07080b] select-none shrink-0':'relative w-full h-full overflow-hidden select-none'} style=${pad?{aspectRatio:'1 / 0.6325',maxWidth:'calc((100vh - 300px) / 0.6325)',marginInline:'auto'}:{}}>
    <div className="absolute bg-black" style=${{left:ox,top:oy,width:1920,height:1080,transform:`scale(${k})`,transformOrigin:'0 0'}}>

        ${spr.map(e=>html`<${Sprite} key=${e.n} e=${e} k=${k} ed=${ed}/>`)}</div>
      ${say&&html`<div style=${{position:'absolute',left:bx,top:by,width:D.w,height:D.h,boxSizing:'border-box',padding:D.pad,borderRadius:D.radius,overflow:'hidden',fontFamily:FF,zIndex:1000,background:bg0}}>
        <div style=${{fontSize:D.size,lineHeight:1.3,color:'#fff',whiteSpace:'pre-wrap'}}>${(say.text||'').replace(/\{w\}/g,' ▾')||'…'}</div></div>`}
      ${say&&say.who?html`<div style=${{position:'absolute',left:bx+D.pad,top:by,transform:'translateY(calc(-100% - 6px))',padding:'6px 28px',borderRadius:Math.min(D.radius,40),background:rgba(D.color,D.op),fontFamily:FF,fontSize:D.size*1.05,fontWeight:700,color:say.color||'#c4b5fd',zIndex:1001,whiteSpace:'nowrap'}}>${say.who}</div>`:null}
      ${say&&qi.length?html`<div style=${{position:'absolute',right:1920-bx-D.w,top:qy,display:'flex',gap:36,fontSize:30,fontFamily:FF,zIndex:1050}}>${qi.map(x=>qmAct?html`<button key=${x[0]} onClick=${ev=>{ev.stopPropagation();qmAct[x[0]]&&qmAct[x[0]]()}} style=${{color:qmOn&&qmOn[x[0]]?'#c4b5fd':'#e4e4e7',textShadow:'0 2px 6px #000'}}>${x[1]}</button>`:html`<span key=${x[0]} style=${{color:'#e4e4e7',textShadow:'0 2px 6px #000'}}>${x[1]}</span>`)}</div>`:null}
      ${menu&&html`<div style=${{position:'absolute',inset:0,display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',gap:28,zIndex:1100}}>${menu.map(o=>html`<button key=${o.j} onClick=${ev=>{ev.stopPropagation();onMenu&&onMenu(o.j)}} style=${{fontSize:44,color:'#fff',background:'rgba(8,10,18,.85)',border:'3px solid rgba(167,139,250,.7)',borderRadius:20,padding:'20px 80px',minWidth:900}}>${o.text||'…'}</button>`)}</div>`}
      ${extra?extra(k):null}
      ${blk?html`<div key=${blk} style=${{position:'absolute',inset:0,background:'#000',zIndex:2000,pointerEvents:'none',animation:`blk ${2*bd}s linear forwards`}}></div>`:null}
      ${empty&&html`<div style=${{position:'absolute',inset:0,display:'grid',placeItems:'center',fontSize:48,color:'#52525b',textAlign:'center'}}>Загрузите фон и спрайты слева</div>`}
    </div>
    ${pad&&html`<div className="absolute pointer-events-none" style=${{left:ox,top:oy,width:1920*k,height:1080*k,boxShadow:'0 0 0 9999px rgba(11,13,18,.62)',outline:'1px solid #7c3aed'}}></div>`}
  </div>`;
}

function gen(brs,assets,vars,frac,chars=[]){
  const fm=fileMap(assets),A=Object.fromEntries(assets.map(a=>[a.id,a])),tg=id=>(A[id].kind==='bg'?'bg_':'spr_')+fm[id].base;
  const q=t=>'"'+String(t).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n')+'"';
  const f=(v,m)=>frac?(v/m).toFixed(4):Math.round(v);
  const vn=id=>{const i=vars.findIndex(v=>v.id===id);return i<0?'_нет_переменной':vname(vars[i],i)};
  const lb=id=>id===brs[0].id?'start':'branch_'+brs.findIndex(b=>b.id===id);
  const J=id=>id&&brs.some(b=>b.id===id)?'jump '+lb(id):'pass';
  const lit=(id,val)=>{const v=vars.find(x=>x.id===id);return v&&v.type==='num'?(+val||0):(val?'True':'False')};
  const trl=b=>{const d=b.dur||.5;return b.tr==='dissolve'?[`with Dissolve(${d})`]:b.tr==='fade'?[`with Fade(${d}, 0, ${d})`]:[]};
  const Hd=["# script.rpy — создано в Ren'Py Mod Builder","# Картинки: game/images/, звуки: game/audio/",''],Bd=[],decl={};
  vars.forEach((v,i)=>Hd.push(`default ${vname(v,i)} = ${v.type==='num'?(+v.init||0):(v.init?'True':'False')}`));Hd.push('');
  const cv=c=>{const t=slug(c.name);return t==='file'?'char_'+(chars.indexOf(c)+1):t};chars.forEach(c=>Hd.push(`define ${cv(c)} = Character(${q(c.name)}, color="${hx(c.color)}")`));if(chars.length)Hd.push('');
  const ds=a=>{if(!decl[a.id]){decl[a.id]=1;Hd.push(`image ${tg(a.id)} = "images/${fm[a.id].file}"`)}};
  brs.forEach(br=>{Bd.push('',`label ${lb(br.id)}:`);const on=new Set();
    br.blocks.forEach(b=>{const a=A[b.assetId];let L=[];
      if(b.type==='bg'&&a){const key=a.id+':'+b.w+'x'+b.h;if(!decl[key]){const first=!Object.keys(decl).some(x=>x.startsWith(a.id+':'));decl[key]=tg(a.id)+(first?'':'_'+b.w+'x'+b.h);Hd.push(`image ${decl[key]} = Transform("images/${fm[a.id].file}", xysize=(${b.w}, ${b.h}))`)}
        on.clear();L=[`scene ${decl[key]} at Transform(xpos=0, ypos=0)`,...trl(b)]}
      else if(b.type==='show'&&a){ds(a);const z=b.z||1,px=f(b.x,1920),py=f(b.y,1080);
        L=b.glide&&on.has(a.id)?[`show ${tg(a.id)} zorder ${z}:`,`    linear ${b.gdur||1} xpos ${px} ypos ${py} zoom ${b.scale}`]:[`show ${tg(a.id)} at Transform(xpos=${px}, ypos=${py}${b.scale!==1?', zoom='+b.scale:''}) zorder ${z}`,...trl(b)];on.add(a.id)}
      else if(b.type==='hide'&&a){L=['hide '+tg(a.id)];on.delete(a.id)}
      else if(b.type==='say'){const c=chars.find(x=>x.id===b.ch);L=[(c?cv(c)+' ':b.who?q(b.who)+' ':'')+q(b.text)]}
      else if(b.type==='code')L=String(b.code||'').split('\n');
      else if(b.type==='audio'){L=b.mode==='stop'?['stop music'+(b.fadeout?' fadeout '+b.fadeout:'')]:a?[`play ${b.mode} "audio/${fm[a.id].file}"`+(b.fadein?' fadein '+b.fadein:'')]:[]}
      else if(b.type==='set')L=[`$ ${vn(b.vr)} ${b.op||'='} ${lit(b.vr,b.val)}`];
      else if(b.type==='jump')L=[J(b.to)];
      else if(b.type==='if')L=[`if ${vn(b.vr)} ${b.cmp||'=='} ${lit(b.vr,b.val)}:`,'    '+J(b.then),...(b.els?['else:','    '+J(b.els)]:[])];
      else if(b.type==='menu'){L=['menu:',...(b.prompt?['    '+q(b.prompt)]:[])];b.opts.forEach(o=>{L.push(`    ${q(o.text)}:`);if(o.vr)L.push(`        $ ${vn(o.vr)} ${o.op||'='} ${lit(o.vr,o.val)}`);L.push('        '+J(o.to))})}
      else if(b.type==='scare'&&a){ds(a);const sn=A[b.snd];L=[`show ${tg(a.id)} at Transform(xpos=0.5, ypos=0.5, xanchor=0.5, yanchor=0.5, zoom=${b.scale||1}) zorder 99`,...(sn?[`play sound "audio/${fm[sn.id].file}"`]:[]),'with hpunch','pause 0.8','hide '+tg(a.id)]}
      if(b.chance&&b.chance<100&&L.length)L=[`if renpy.random.randint(1, 100) <= ${b.chance}:`,...L.map(l=>l?'    '+l:l)];
      L.forEach(l=>Bd.push(l.trim()?'    '+l:''))});
    Bd.push('    return')});
  return Hd.concat(Bd,['']).join('\n')}

function Player({brs,assets,vars,chars,ui,start,store,onLoad,onClose}){
  const [v,setV]=useState({spr:[]}),[pn,setPn]=useState(null),[fl,setFl]=useState({auto:false,skip:false}),flr=useRef({auto:false,skip:false}),[,setTick]=useState(0),ck=useRef(null),pk=useRef(null),api=useRef({});
  useEffect(()=>{
    let dead=false;const A=Object.fromEntries(assets.map(a=>[a.id,a])),sleep=ms=>new Promise(r=>setTimeout(r,ms)),au={m:null},S={spr:[],n:0},env={};
    const push=()=>{if(!dead)setV({...S,spr:[...S.spr]})},click=()=>new Promise(r=>{ck.current=r}),vt=id=>(vars.find(x=>x.id===id)||{}).type;
    vars.forEach(x=>{env[x.id]=x.type==='num'?+x.init||0:!!x.init});
    const setv=(id,op,val)=>{if(vt(id)==='num'){const x=+val||0;env[id]=op==='+='?env[id]+x:op==='-='?env[id]-x:x}else env[id]=!!val};
    const ramp=(a,to,sec,end)=>{const f=a.volume,t0=Date.now(),iv=setInterval(()=>{const p=sec?Math.min(1,(Date.now()-t0)/sec/1000):1;a.volume=f+(to-f)*p;if(p>=1){clearInterval(iv);end&&end()}},50)};
    const fxd=b=>b.tr==='dissolve'?+b.dur||.5:0;
    const trn=async(b,apply)=>{const d=+b.dur||.5;
      if(b.tr==='fade'){S.blk=++S.n;S.bd=d;push();await sleep(d*1000);if(dead)return;apply();push();await sleep(d*1000);S.blk=0}
      else{apply();push();if(fxd(b)){await sleep(d*1000);S.prev=null}}push()};
    const say=async(who,text,color)=>{
      store.hist.push(api.current.snap());store.log.push({who,text:text.replace(/\{w\}/g,''),color});store.atSay=true;
      let sh='';
      for(const t of text.split('{w}')){const base=sh;sh+=t;let done=false;const pr=click().then(()=>{done=true});
        if(!flr.current.skip)for(let n=1;n<=t.length&&!done&&!dead;n++){S.say={who,text:base+t.slice(0,n),color};push();await sleep(25)}
        S.say={who,text:sh,color};push();if(dead)return;
        if(flr.current.skip)await Promise.race([pr,sleep(60)]);
        else if(done)await click();
        else if(flr.current.auto)await Promise.race([pr,sleep(2200)]);
        else await pr;
        if(dead)return}
      store.atSay=false;S.say=null;push()};
    try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
    let cur=brs[0].id,i=0,pos={cur,i:0},bgB=null,musB=null;
    if(start){cur=start.cur;i=start.i;Object.assign(env,start.env);bgB=start.bgB;musB=start.musB;
      if(bgB&&A[bgB.assetId])S.bg={src:A[bgB.assetId].src,w:bgB.w,h:bgB.h,fx:0,n:++S.n};
      S.spr=(start.spr||[]).filter(e=>A[e.assetId]).map(e=>({...e,a:A[e.assetId],fx:0,n:++S.n,tr0:0}));
      const mb=musB&&A[musB.assetId];if(mb){const m=new Audio(mb.src);m.loop=true;m.play().catch(()=>{});au.m=m}}
    api.current.snap=()=>({cur:pos.cur,i:pos.i,env:{...env},bgB,musB,spr:S.spr.map(({a,...r})=>r),t:Date.now(),label:(brs.find(x=>x.id===pos.cur)||{}).name});
    (async()=>{
      while(!dead){const bl=(brs.find(x=>x.id===cur)||{blocks:[]}).blocks;if(i>=bl.length)break;const b=bl[i++],a=A[b.assetId];pos={cur,i:i-1};
        if(b.chance&&b.chance<100&&Math.floor(Math.random()*100)+1>b.chance)continue;
        if(b.type==='bg'&&a)await trn(b,()=>{bgB=b;S.prev=S.bg;S.bg={src:a.src,w:b.w,h:b.h,fx:fxd(b),n:++S.n};S.spr=[]});
        else if(b.type==='show'&&a){const ex=S.spr.find(x=>x.assetId===b.assetId),g=b.glide&&ex;
          await trn(g?{}:b,()=>{S.spr=[...S.spr.filter(x=>x.assetId!==b.assetId),{...b,a,fx:g?0:fxd(b),n:g?ex.n:++S.n,tr0:g?(+b.gdur||1):0}]})}

    return html`<div className="rounded-lg p-4 overflow-auto" style=${{background:pf.bg,aspectRatio:'16 / 9'}}><div className="text-center text-xl mb-3 text-white">Настройки</div><div className="max-w-md mx-auto space-y-3 text-sm text-white">
      ${pf.fs?html`<div className="flex gap-6" style=${{color:pf.btn}}><span>Окно</span><span>Полный экран</span></div>`:null}
      ${[['music','Музыка'],['sfx','Звуки'],['master','Общая громкость'],['speed','Скорость текста'],['auto','Авто-перемотка']].filter(x=>pf[x[0]]).map(x=>html`<div key=${x[0]} className="flex items-center gap-3"><span className="w-36">${x[1]}</span><div className="flex-1 h-3 rounded bg-white/20"><div className="h-3 rounded w-2/3" style=${{background:pf.slider}}></div></div></div>`)}
      ${pf.skipU?html`<div style=${{color:pf.btn}}>Пропускать непрочитанное</div>`:null}${pf.skipC?html`<div style=${{color:pf.btn}}>Пропуск после выборов</div>`:null}</div></div>`};
  const sl=Object.values(spr).sort((a,b)=>(b.z||1)-(a.z||1));
  const layers=sl.length?html`<div className="shrink-0 space-y-1 px-1">${sl.map(b=>html`<div key=${b.id} className="flex items-center gap-2 text-xs bg-white/5 rounded px-2 py-1"><span className="flex-1 truncate">${(A[b.assetId]||{}).name} · zorder ${b.z||1}</span>
    <button className="p-1.5 hover:bg-white/10 rounded" title="На передний план" onClick=${()=>layer(b.assetId,1)}><${I} n="ChevronsUp"/></button><button className="p-1.5 hover:bg-white/10 rounded" title="На задний план" onClick=${()=>layer(b.assetId,-1)}><${I} n="ChevronsDown"/></button></div>`)}</div>`:null;
  const pnl=(id,extra)=>`${tab===id?'flex':'hidden'} md:flex flex-col flex-1 min-h-0 md:flex-none ${extra} bg-[#0f1218] overflow-y-auto`;

  return html`<div className="h-full flex flex-col md:flex-row">
  <aside className=${pnl('a','md:w-64 md:border-r border-white/10 p-3')}>
    <${H} t="Ассеты"/>
    <div id="sec-assets" className=${'flex flex-col gap-2 '+(hl==='assets'?'ring-2 ring-violet-500 rounded p-1':'')}>${Up('bg','Загрузить фон','Image')}${Up('sprite','Загрузить спрайт (PNG)','User')}${Up('audio','Загрузить звук (mp3/ogg/wav)','Music')}${Up('font','Шрифт (.ttf / .otf)','Type')}</div>
    <div className="mt-2 space-y-1">${assets.map(a=>html`<div key=${a.id} className="flex items-center gap-2 text-xs bg-white/5 rounded p-1">
      <img src=${a.src} className="w-9 h-9 object-contain bg-black/40 rounded"/><span className="flex-1 truncate">${a.name}</span>
      <button className="p-1.5 hover:bg-white/10 rounded" title="На сцену" onClick=${()=>{addBlocks([blockFor(a)]);setTab('b')}}><${I} n="Plus"/></button></div>`)}</div>
    <${H} t="Шаги сценария"/>
    <div className="flex flex-col gap-2">
      <button className=${btn} onClick=${addSay}><${I} n="MessageSquare"/>+ Текст <span className="ml-auto text-[10px] text-zinc-500">Ctrl+Enter</span></button>
      <button className=${btn} onClick=${()=>{addBlocks([{type:'code',code:''}]);setTab('c')}}><${I} n="Code"/>+ Свой код Ren'Py</button>
      <button className=${btn} onClick=${()=>{const id=Object.keys(spr).pop()||(assets.find(a=>a.kind==='sprite')||{}).id;if(id)addBlocks([{type:'hide',assetId:id}]);else hint('Сначала загрузите спрайт — нажмите, чтобы перейти к загрузке','assets')}}><${I} n="EyeOff"/>+ Убрать спрайт</button></div>${more}${varsUI}${charsUI}
    <${H} t="Библиотека пресетов"/>
    <div className="flex gap-1"><input className=${inp} placeholder="Название" value=${pname} onChange=${e=>setPname(e.target.value)}/><button className=${btn} title="Сохранить отмеченные (или все) блоки" onClick=${savePreset}><${I} n="Save"/></button></div>
    <p className="text-[11px] text-zinc-500 mt-1">Сохраняются отмеченные галочкой блоки, а если ничего не отмечено — вся лента.</p>
    <div className="mt-2 space-y-1">${presets.map(p=>html`<div key=${p.id} className="flex items-center gap-1 text-xs bg-white/5 rounded p-1.5"><span className="flex-1 truncate">${p.name} · ${p.blocks.length}</span>
      <button className="p-1.5 hover:bg-white/10 rounded" title="Вставить" onClick=${()=>loadPreset(p)}><${I} n="Plus"/></button>
      <button className="p-1.5 hover:bg-white/10 rounded" onClick=${()=>setPresets(x=>x.filter(y=>y.id!==p.id))}><${I} n="Trash2"/></button></div>`)}</div>
    <div className="flex gap-2 mt-2"><button className=${btn} onClick=${()=>saveFile('presets.json',JSON.stringify({presets}),setMsg)}><${I} n="FileJson"/>Экспорт</button>
      <label className=${btn+' cursor-pointer'}><${I} n="Upload"/>Импорт<input type="file" accept=".json" hidden onChange=${e=>{if(e.target.files[0])importJson(e.target.files[0]);e.target.value=''}}/></label></div>
  </aside>

  <main className=${(tab==='b'?'flex':'hidden')+' md:flex flex-col flex-1 min-w-0 min-h-0 p-2 gap-2 bg-[#0b0d12] overflow-y-auto'}>
    <div className="flex gap-1 shrink-0 overflow-x-auto">${[['story','Сценарий'],['menu','Главное меню'],['prefs','Экран настроек'],['say','Окно диалогов']].map(([k,t])=>html`<button key=${k} onClick=${()=>{setView(k);setRt('p')}} className=${'px-3 py-1.5 rounded text-sm whitespace-nowrap '+(view===k?'bg-white/15 text-white':'text-zinc-400 hover:bg-white/5')}>${t}</button>`)}</div>
    ${view==='story'?html`
    <div className="flex items-center gap-1 shrink-0 overflow-x-auto">${branches.map(b=>html`<button key=${b.id} onClick=${()=>{setBr(b.id);setSel(null);setPv(null)}} className=${'px-2.5 py-1 rounded text-xs whitespace-nowrap '+(b.id===br?'bg-violet-600':'bg-white/5 hover:bg-white/10')}>${b.name}</button>`)}
      <button className=${btn} title="Новая ветка" onClick=${()=>{const id=nb();setBr(id);setSel(null);setPv(null)}}><${I} n="Plus"/></button></div>
    <div className="flex items-center gap-1 shrink-0"><input className=${inp} title="Название ветки" value=${bnm(br)} onChange=${e=>setBranches(bs=>bs.map(b=>b.id===br?{...b,name:e.target.value}:b))}/>
      ${br!==branches[0].id&&html`<button className=${btn} title="Удалить ветку" onClick=${()=>{setBranches(bs=>bs.filter(b=>b.id!==br));setBr(branches[0].id);setSel(null);setPv(null)}}><${I} n="Trash2"/></button>`}
      <button className=${pri+' whitespace-nowrap'} onClick=${()=>setPlay({start:null,k:Date.now(),store:{hist:[],log:[]}})}><${I} n="Play"/>Играть</button></div>
    <${Scene} pad=${true} sty=${sty} bg=${bg&&A[bg.assetId]?{src:A[bg.assetId].src,w:bg.w,h:bg.h,n:bg.id}:null} spr=${Object.values(spr).filter(b=>A[b.assetId]).map(b=>({...b,a:A[b.assetId],n:b.id}))} say=${say&&{...say,color:(chars.find(c=>c.id===say.ch)||{}).color}} menu=${menu} ed=${{upd,pick,clamp,sel}} empty=${!bg&&!blocks.length}/>
    <div className="flex items-center gap-4 px-1 shrink-0"><${Chk} v=${clamp} on=${setClamp} t="Ограничить границами экрана"/><span className="text-xs text-zinc-500 mb-3">Кадр 1920×1080</span></div>
    ${layers}
    <div className="flex-1 min-h-[120px] overflow-y-auto space-y-1">
      ${!blocks.length&&html`<p className="text-sm text-zinc-500 p-2">Лента пуста. Добавьте фон, спрайт или реплику.</p>`}
      ${blocks.map((b,i)=>html`<div key=${b.id} onClick=${()=>go(b.id)} className=${'flex items-center gap-2 rounded px-2 py-1.5 text-sm cursor-pointer border '+(sel===b.id?'border-violet-500 bg-violet-500/10':'border-transparent bg-white/5 hover:bg-white/10')+(i===idx?' ring-1 ring-white/20':'')}>
        <input type="checkbox" checked=${!!b.chk} onClick=${e=>e.stopPropagation()} onChange=${e=>upd(b.id,{chk:e.target.checked})} className="accent-violet-500"/>
        <${I} n=${ICON[b.type]}/><span className="flex-1 truncate">${lab(b)}</span>
        ${sel===b.id&&html`<span className="flex" onClick=${e=>e.stopPropagation()}>
          <button className="p-1.5 hover:bg-white/10 rounded" onClick=${()=>move(b.id,-1)}><${I} n="ArrowUp"/></button>
          <button className="p-1.5 hover:bg-white/10 rounded" onClick=${()=>move(b.id,1)}><${I} n="ArrowDown"/></button>
          <button className="p-1.5 hover:bg-red-500/20 rounded text-red-300" onClick=${()=>del(b.id)}><${I} n="Trash2"/></button></span>`}</div>`)}
    </div>
`:editorView()}
  </main>

  <aside className=${pnl('c','md:w-80 md:border-l border-white/10')}>
    <div className="flex border-b border-white/10 shrink-0">${[['p','Свойства'],['c','Код']].map(([id,t])=>html`<button key=${id} onClick=${()=>setRt(id)} className=${'flex-1 py-2.5 text-sm '+(rt===id?'text-violet-300 border-b-2 border-violet-500':'text-zinc-400')}>${t}</button>`)}</div>
    <div className="p-3 flex-1">
    ${rt==='p'?(view==='story'?props():uiProps()):html`<div>
      ${projUI}<div className="flex gap-2 mb-2"><button className=${pri+' flex-1'} onClick=${()=>saveFile(fsel,code,setMsg)}><${I} n="Download"/>Скачать ${fsel}</button>
        <button className=${btn} title="Копировать" onClick=${()=>navigator.clipboard.writeText(code).then(()=>setMsg('Скопировано'),()=>setMsg('Не удалось скопировать'))}><${I} n="Copy"/></button></div>
      <button className=${pri+' w-full mb-3'} onClick=${()=>zipMod(branches,assets,vars,frac,chars,ui,proj,setMsg)}><${I} n="Package"/>Скачать мод (.zip)</button>
      <${Chk} v=${frac} on=${setFrac} t="Позиции в долях 0–1 (иначе в пикселях)"/>
      <pre className="text-[11px] leading-relaxed font-mono bg-[#07080b] border border-white/10 rounded p-2 overflow-x-auto whitespace-pre">${code}</pre>
      <p className="text-xs text-zinc-500 mt-2">Положите script.rpy в game/ мода, а картинки — в game/images/.</p></div>`}
    </div>
  </aside>

  ${play&&html`<${Player} key=${play.k} brs=${branches} assets=${assets} vars=${vars} chars=${chars} ui=${ui} start=${play.start} store=${play.store} onLoad=${(sn,st)=>setPlay({start:sn,k:Date.now(),store:st||{hist:[],log:[]}})} onClose=${()=>setPlay(false)}/>`}
  ${msg&&html`<button className=${'fixed z-40 left-1/2 -translate-x-1/2 bottom-16 md:bottom-4 max-w-[92vw] px-4 py-2 rounded-lg shadow-lg text-sm '+(goto?'bg-violet-600 hover:bg-violet-500':'bg-zinc-800 border border-white/10')} onClick=${()=>goto?gotoSec(goto):setMsg('')}>${msg}${goto?' →':''}</button>`}
  <nav className="md:hidden flex shrink-0 border-t border-white/10 bg-[#0f1218]">${[['a','Layers','Ассеты'],['b','Image','Сцена'],['c','Code','Свойства']].map(([id,ic,t])=>html`<button key=${id} onClick=${()=>setTab(id)} className=${'flex-1 py-2 flex flex-col items-center gap-0.5 text-xs '+(tab===id?'text-violet-300':'text-zinc-500')}><${I} n=${ic}/>${t}</button>`)}</nav>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
